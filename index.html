<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Info</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      background: #000;
      overflow-x: hidden;
    }

    /* 레터박스: 모든 콘텐츠를 480px 컬럼으로 중앙 제한 */
    #page-frame {
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
      position: relative;
      background: #000;
    }

    /* ── 인트로 wrapper ── */
    #intro-wrapper {
      position: relative;
      height: 100vh;
    }

    #intro-sticky {
      position: sticky;
      top: 0;
      width: 100%;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    #bg-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    /* 로고 컨테이너 */
    #logo-wrap {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
      will-change: transform, opacity;
    }

    #svg2 {
      opacity: 0;
      transform: translateY(6px);
      transition: opacity 0.8s cubic-bezier(0.4,0,0.2,1), transform 0.8s cubic-bezier(0.4,0,0.2,1);
    }
    #svg2.visible {
      opacity: 1;
      transform: translateY(-12px);
    }

    #svg1 {
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 1s cubic-bezier(0.4,0,0.2,1), transform 1s cubic-bezier(0.4,0,0.2,1);
    }
    #svg1.visible {
      opacity: 1;
      transform: translateY(0);
    }

    #svg1 svg { width: min(72vw, 220px); height: auto; }
    #svg2 svg { width: min(42vw, 126px); height: auto; }

    /* 스크롤 힌트 */
    #scroll-hint {
      position: absolute;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 3;
      display: flex;
      flex-direction: column;
      align-items: center;
      opacity: 0;
      transition: opacity 0.6s ease;
    }
    #scroll-hint.show { opacity: 0.5; }
    #scroll-hint span {
      display: block;
      width: 1px;
      height: 28px;
      background: linear-gradient(to bottom, rgba(255,255,255,0.8), transparent);
      animation: scrollPulse 1.8s ease-in-out infinite;
    }
    @keyframes scrollPulse {
      0%,100% { transform: scaleY(1); opacity:0.6; }
      50%      { transform: scaleY(1.4); opacity:1; }
    }

    /* ── INFO SECTION ── */
    #info-section {
      position: relative;
      z-index: 2;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #000;
    }
    #info-section img {
      width: 100%;
      height: auto;
      display: block;
    }
  </style>
</head>

<!-- INFO: 인트로 바로 아래 자연스럽게 이어짐 -->
<section id="info-section">
  <img src="info.png" alt="info" />
</section>
</div>

<script>
(function() {
  const canvas = document.getElementById('bg-canvas');
  const ctx = canvas.getContext('2d');

  let W, H, dpr;
  let mx = 0.5, my = 0.5;
  let targetMx = 0.5, targetMy = 0.5;
  let time = 0;

  function resize() {
    dpr = window.devicePixelRatio || 1;
    W = canvas.offsetWidth;
    H = canvas.offsetHeight;
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    ctx.scale(dpr, dpr);
  }

  function drawBg(scrollP) {
    ctx.clearRect(0, 0, W, H);

    const t = time * 0.0007;
    const wobX = Math.sin(t * 0.6) * 0.025;
    const wobY = Math.cos(t * 0.45) * 0.022;
    const lx = mx + wobX;
    const ly = my + wobY;

    const base = ctx.createRadialGradient(W*0.5, H*0.5, 0, W*0.5, H*0.5, W*0.75);
    base.addColorStop(0,    '#2a4fa0');
    base.addColorStop(0.45, '#1d3d85');
    base.addColorStop(0.75, '#152a55');
    base.addColorStop(1,    '#0f1024');
    ctx.fillStyle = base;
    ctx.fillRect(0, 0, W, H);

    const coreX = W * (0.50 + (lx - 0.5) * 0.06);
    const coreY = H * (0.48 + (ly - 0.5) * 0.05);
    const core = ctx.createRadialGradient(coreX, coreY, 0, coreX, coreY, W * 0.38);
    core.addColorStop(0,    'rgba(79,202,209, 0.92)');
    core.addColorStop(0.12, 'rgba(75,181,203, 0.80)');
    core.addColorStop(0.28, 'rgba(73,169,200, 0.60)');
    core.addColorStop(0.50, 'rgba(74,143,193, 0.32)');
    core.addColorStop(0.75, 'rgba(61,112,175, 0.10)');
    core.addColorStop(1,    'rgba(33,80,162,  0)');
    ctx.fillStyle = core;
    ctx.fillRect(0, 0, W, H);

    const topX = W * (0.5 + (lx - 0.5) * 0.04);
    const top = ctx.createRadialGradient(topX, H*(-0.05), 0, topX, H*(-0.05), H * 0.72);
    top.addColorStop(0,    'rgba(54,93,172,  0.55)');
    top.addColorStop(0.3,  'rgba(74,122,188, 0.35)');
    top.addColorStop(0.6,  'rgba(73,145,195, 0.15)');
    top.addColorStop(1,    'rgba(33,80,162,  0)');
    ctx.fillStyle = top;
    ctx.fillRect(0, 0, W, H);

    const leftGrad = ctx.createLinearGradient(0, 0, W * 0.45, 0);
    leftGrad.addColorStop(0,    'rgba(15,16,36,   0.85)');
    leftGrad.addColorStop(0.15, 'rgba(21,42,85,   0.60)');
    leftGrad.addColorStop(0.30, 'rgba(47,84,164,  0.28)');
    leftGrad.addColorStop(0.50, 'rgba(78,129,192, 0.08)');
    leftGrad.addColorStop(1,    'rgba(15,16,36,   0)');
    ctx.fillStyle = leftGrad;
    ctx.fillRect(0, 0, W, H);

    const rightGrad = ctx.createLinearGradient(W, 0, W * 0.55, 0);
    rightGrad.addColorStop(0,    'rgba(15,16,36,   0.85)');
    rightGrad.addColorStop(0.15, 'rgba(22,41,84,   0.60)');
    rightGrad.addColorStop(0.30, 'rgba(47,84,164,  0.28)');
    rightGrad.addColorStop(0.50, 'rgba(76,121,189, 0.08)');
    rightGrad.addColorStop(1,    'rgba(15,16,36,   0)');
    ctx.fillStyle = rightGrad;
    ctx.fillRect(0, 0, W, H);

    const botGrad = ctx.createLinearGradient(0, H*0.6, 0, H);
    botGrad.addColorStop(0,   'rgba(15,16,36, 0)');
    botGrad.addColorStop(0.5, 'rgba(15,16,36, 0.35)');
    botGrad.addColorStop(1,   'rgba(10,12,28, 0.75)');
    ctx.fillStyle = botGrad;
    ctx.fillRect(0, 0, W, H);

    const topDark = ctx.createLinearGradient(0, 0, 0, H*0.3);
    topDark.addColorStop(0,   'rgba(10,12,28, 0.55)');
    topDark.addColorStop(1,   'rgba(10,12,28, 0)');
    ctx.fillStyle = topDark;
    ctx.fillRect(0, 0, W, H);

    if (scrollP > 0) {
      ctx.fillStyle = `rgba(0,0,0,${Math.min(scrollP * 1.4, 1)})`;
      ctx.fillRect(0, 0, W, H);
    }
  }

  const logoWrap = document.getElementById('logo-wrap');
  const hint     = document.getElementById('scroll-hint');

  function onScroll() {
    const vh = window.innerHeight;
    const sy = window.scrollY;
    const scrollP = Math.min(sy / vh, 1);

    // 로고 parallax + fade
    const logoMove = sy * 0.35;
    const logoFade = Math.max(0, 1 - scrollP * 2.5);
    logoWrap.style.transform = `translateY(-${logoMove}px)`;
    logoWrap.style.opacity = logoFade;

    // 배경 페이드
    drawBg(scrollP);

    // 힌트
    hint.classList.toggle('show', scrollP < 0.05);
  }

  function onMove(e) {
    const vw = window.innerWidth, vh = window.innerHeight;
    const x = e.touches ? e.touches[0].clientX : e.clientX;
    const y = e.touches ? e.touches[0].clientY : e.clientY;
    targetMx = x / vw;
    targetMy = y / vh;
  }

  function tick(ts) {
    time = ts;
    mx += (targetMx - mx) * 0.04;
    my += (targetMy - my) * 0.04;
    drawBg(Math.min(window.scrollY / window.innerHeight, 1));
    requestAnimationFrame(tick);
  }

  window.addEventListener('mousemove', onMove, { passive: true });
  window.addEventListener('touchmove', onMove, { passive: true });
  window.addEventListener('scroll', onScroll, { passive: true });
  window.addEventListener('resize', () => { resize(); drawBg(0); });

  resize();
  requestAnimationFrame(tick);

  // 로고 등장
  setTimeout(() => document.getElementById('svg1').classList.add('visible'), 300);
  setTimeout(() => document.getElementById('svg2').classList.add('visible'), 800);
  setTimeout(() => hint.classList.add('show'), 2000);
})();
</script>
</body>
